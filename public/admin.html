<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body { font-family: Arial; background: #0a0a0a; color: #0f0; padding: 20px; }
        h1 { color: #f00; }
        .card { background: #111; padding: 15px; margin: 10px 0; border: 1px solid #0f0; border-radius: 8px; }
        pre { color: #0f0; overflow-x: auto; font-size: 12px; }
        img { max-width: 300px; border: 2px solid #f00; }
        input, button { padding: 10px; margin: 5px; background: #222; color: #0f0; border: 1px solid #0f0; }
        button { background: #0f0; color: #000; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🛠️ ADMIN PANEL</h1>
    <div>
        <input type="password" id="adminKey" placeholder="Admin Key">
        <button onclick="loadData()">Load Data</button>
    </div>
    <div id="dataContainer"></div>
    
    <script>
        async function loadData() {
            const key = document.getElementById('adminKey').value;
            const r = await fetch(`/api/admin?key=${key}`);
            if (!r.ok) return alert('Akses ditolak');
            const data = await r.json();
            
            const container = document.getElementById('dataContainer');
            container.innerHTML = '';
            
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<h3>${item.type} - ${item.email || item.pin || ''}</h3>
                    <p>IP: ${item.ip || '-'} | Time: ${item.timestamp || '-'}</p>
                    <pre>${JSON.stringify(item.data || item, null, 2).substring(0, 500)}</pre>`;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
